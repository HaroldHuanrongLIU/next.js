# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

# Also enforced for .tsx files by no-typeof-window-require-tsx.yml (ast-grep
# rules are single-language; keep the two `rule` bodies in sync).
id: no-typeof-window-require
message: Don't gate a `require()` on `typeof window === 'undefined'`.
note: |
  Gating a `require()` on `typeof window === 'undefined'` runs the require on the
  server and bundles that module into the browser bundle. Split it into
  `<name>.ts` (the default, used on the server and any unbundled runtime) and
  `<name>.browser.ts` (the browser variant). The browser bundle is aliased to the
  `.browser` sibling automatically — see scripts/generate-browser-variant-aliases.mjs.
severity: error
language: TypeScript
files:
  - packages/next/src/**
rule:
  pattern: require($$$ARGS)
  inside:
    stopBy: end
    any:
      - kind: ternary_expression
        has:
          field: condition
          any:
            - pattern: typeof window === 'undefined'
            - has:
                stopBy: end
                pattern: typeof window === 'undefined'
      - kind: if_statement
        has:
          field: condition
          any:
            - pattern: typeof window === 'undefined'
            - has:
                stopBy: end
                pattern: typeof window === 'undefined'
